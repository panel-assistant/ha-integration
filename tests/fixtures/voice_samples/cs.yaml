match:
  - {text: "ukaž stránku kamery", command: show_page, page: kamery}
  - {text: "zobraz mi nástěnku energie", command: show_page, page: energie}
  - {text: "ukažte zobrazení obývák", command: show_page, page: obývák}
  - {text: "přejdi na stránku obývák", command: show_page, page: obývák}
  - {text: "ukaž domovskou stránku", command: show_page, page: domovskou}
  - {text: "jdi na hlavní stránku", command: show_page, page: hlavní}
  - {text: "zobraz výchozí nástěnku", command: show_page, page: výchozí}
  - {text: "zobraz stránku hlavní", command: show_page, page: hlavní}
