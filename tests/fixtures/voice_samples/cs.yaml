  - {text: "ukaž mi nastavení systému android", command: android_settings}
  - {text: "ukaž nastavení systému", command: android_settings}
  - {text: "zobraz systémová nastavení", command: android_settings}
  - {text: "ukaž launcher", command: launcher}
