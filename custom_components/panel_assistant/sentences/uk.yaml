# Voice commands a panel answers itself (Ukrainian).
# A {panel} names another panel by its name, after the word "панелі"
# ("на панелі Кухня"), so the name keeps the form Home Assistant knows.
# show_page lists its named-panel forms first: its forms without {panel} end
# in the page name and would otherwise take "камери на панелі Кухня" as the
# page, and Home Assistant acts on the first form that matches.
language: uk
commands:
  show_page:
    sentences:
      - "(покажи|покажіть) [будь ласка] [мені] (сторінку|вкладку|дашборд) {page} на панелі {panel}"
      - "(перейди|перейдіть) [будь ласка] на (сторінку|вкладку|дашборд) {page} на панелі {panel}"
      - "(перейди|перейдіть) [будь ласка] до (сторінки|вкладки|дашборду) {page} на панелі {panel}"
      - "(покажи|покажіть) [будь ласка] [мені] (сторінку|вкладку|панель|дашборд) {page}"
      - "(покажи|покажіть) [будь ласка] [мені] {page} (сторінку|вкладку|панель)"
      - "(перейди|перейдіть) [будь ласка] на (сторінку|вкладку|панель|дашборд) {page}"
      - "(перейди|перейдіть) [будь ласка] на {page} (сторінку|вкладку|панель)"
      - "(перейди|перейдіть) [будь ласка] до (сторінки|вкладки|панелі|дашборду) {page}"
      - "(перейди|перейдіть) [будь ласка] до {page} (сторінки|вкладки|панелі)"
      - "(перемкнися|перемкніться) [будь ласка] на (сторінку|вкладку|панель|дашборд) {page}"
      - "(перемкнися|перемкніться) [будь ласка] на {page} (сторінку|вкладку|панель)"
  android_settings:
    sentences:
      - "(покажи|покажіть) [будь ласка] [мені] налаштування (андроїда|android)"
      - "(перейди|перейдіть) [будь ласка] до налаштувань (андроїда|android)"
      - "(покажи|покажіть) [будь ласка] [мені] на панелі {panel} налаштування (андроїда|android)"
  launcher:
    sentences:
      - "(покажи|покажіть) [будь ласка] [мені] [андроїд|android] лаунчер [андроїда|android]"
      - "(покажи|покажіть) [будь ласка] [мені] (головний екран|робочий стіл|домашній екран) (андроїда|android)"
      - "(перейди|перейдіть) [будь ласка] на (головний екран|робочий стіл|домашній екран) (андроїда|android)"
      - "(покажи|покажіть) [будь ласка] [мені] на панелі {panel} [андроїд|android] лаунчер [андроїда|android]"
      - "(покажи|покажіть) [будь ласка] [мені] на панелі {panel} (головний екран|робочий стіл|домашній екран) (андроїда|android)"
  recents:
    sentences:
      - "(покажи|покажіть) [будь ласка] [мені] (останні|недавні|нещодавні) (застосунки|програми|додатки)"
      - "(покажи|покажіть) [будь ласка] [мені] список (останніх|недавніх|нещодавніх) (застосунків|програм|додатків)"
      - "(покажи|покажіть) [будь ласка] [мені] огляд (застосунків|програм)"
      - "(покажи|покажіть) [будь ласка] [мені] на панелі {panel} (останні|недавні|нещодавні) (застосунки|програми|додатки)"
  back:
    sentences:
      - "(попередня сторінка|на попередню сторінку|назад на попередню сторінку|сторінку назад)"
      - "(попередня сторінка|на попередню сторінку|сторінку назад) на панелі {panel}"
  screen_wake:
    sentences:
      - "(прокинься|прокиньтеся) [будь ласка]"
      - "(розбуди|розбудіть) [будь ласка] (екран|панель)"
      - "(розбуди|розбудіть) [будь ласка] панель {panel}"
      - "(розбуди|розбудіть) [будь ласка] екран на панелі {panel}"
  screen_sleep:
    sentences:
      - "(засни|засніть|засинай|засинайте) [будь ласка]"
      - "(іди|йди|ідіть|йдіть) спати"
      - "(приспи|приспіть) [будь ласка] (екран|панель)"
      - "(переведи|переведіть) [будь ласка] (екран|панель) (у|в) (сон|сплячий режим|режим сну)"
      - "(приспи|приспіть) [будь ласка] панель {panel}"
      - "(приспи|приспіть) [будь ласка] екран на панелі {panel}"
  screen_brighter:
    sentences:
      - "(зроби|зробіть) [будь ласка] [екран] (яскравішим|яскравіше|світлішим|світліше)"
      - "(зроби|зробіть) [будь ласка] яскравіше екран"
      - "(збільш|збільште|підвищ|підвищте) [будь ласка] яскравість [екрану|екрана]"
      - "яскравіше [будь ласка]"
      - "(збільш|збільште|підвищ|підвищте) [будь ласка] яскравість [екрану|екрана] на панелі {panel}"
      - "яскравіше [будь ласка] на панелі {panel}"
  screen_dimmer:
    sentences:
      - "(зроби|зробіть) [будь ласка] [екран] (темнішим|темніше|тьмянішим|тьмяніше)"
      - "(зменш|зменште|знизь|знизьте|убав|убавте) [будь ласка] яскравість [екрану|екрана]"
      - "(притуши|притушіть|приглуши|приглушіть) [будь ласка] екран"
      - "темніше [будь ласка]"
      - "(зменш|зменште|знизь|знизьте|убав|убавте) [будь ласка] яскравість [екрану|екрана] на панелі {panel}"
      - "(притуши|притушіть|приглуши|приглушіть) [будь ласка] екран на панелі {panel}"
      - "темніше [будь ласка] на панелі {panel}"
  volume_up:
    sentences:
      - "(голосніше|гучніше) [будь ласка]"
      - "(зроби|зробіть) [будь ласка] (голосніше|гучніше)"
      - "(збільш|збільште|підвищ|підвищте) [будь ласка] (гучність|звук)"
      - "(підбав|підбавте) [будь ласка] (гучності|звуку)"
      - "(голосніше|гучніше) [будь ласка] на панелі {panel}"
      - "(збільш|збільште|підвищ|підвищте) [будь ласка] (гучність|звук) на панелі {panel}"
  volume_down:
    sentences:
      - "тихіше [будь ласка]"
      - "(зроби|зробіть) [будь ласка] тихіше"
      - "(зменш|зменште|знизь|знизьте|убав|убавте) [будь ласка] (гучність|звук)"
      - "тихіше [будь ласка] на панелі {panel}"
      - "(зменш|зменште|знизь|знизьте|убав|убавте) [будь ласка] (гучність|звук) на панелі {panel}"
home_pages: [головна, головну, головної, домашня, домашню, домашньої, стартова, стартову, стартової, початкова, початкову, початкової, старт]
back_pages: [попередня, попередню, попередньої, минула, минулу, минулої]
panel_words: [панель]
screen_names: [екран, екрану, екрана]
responses:
  show_page: "Показую {page}"
  android_settings: "Відкриваю налаштування Android"
