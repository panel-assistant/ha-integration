version: 2
# Aligned with panel-assistant/android: weekly, grouped, with a 7-day cooldown so a freshly
# published (and possibly compromised) release is never proposed on its first days.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The USB installer frontend; its built output in static/ is checked by the USB installer
  # workflow, so a bump that changes the bundle has to be rebuilt in the same PR.
  - package-ecosystem: npm
    directory: /custom_components/panel_assistant/frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # Test tooling pins in pyproject.toml track the Home Assistant release under test and move
  # with it deliberately, so version updates are off; security updates still arrive.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
