name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# A superseded push should stop burning a runner. Runs on main are never
# cancelled, because main's timings are what the CI budget measures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Skip a tag whose commit already passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/already_passed.sh
      - name: Run Hassfest
        if: steps.gate.outputs.run == 'true'
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
