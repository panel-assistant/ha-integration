name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Branch and PR updates supersede their predecessors. Main checks belong to a
# commit, so later pushes cannot evict a release cut even while it is pending.
# Tags, manual trials and schedules each retain their own independent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14.2"
  # Outside the workspace on purpose: Hassfest and the HACS action both read the
  # repository tree, and a virtual environment sitting in it is theirs to trip over.
  VENV: /home/runner/ci-venv

jobs:
  # A release tag points at a commit main has already tested; this decides
  # whether the matrix has anything left to prove.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Skip a tag whose commit already passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/already_passed.sh

  tests:
    name: Home Assistant ${{ matrix.home-assistant }} · ${{ matrix.shard }}/2
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Pushes and manual runs made by a person use Blacksmith while the Actions variable CI_RUNNER is
    # blacksmith; pull requests, schedules and anything a bot starts stay GitHub-hosted.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && vars.CI_RUNNER == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # Each version's suite runs as two halves on two runners, which keeps the
        # check near five minutes; --shard takes every second test in turn.
        shard: [1, 2]
        # The oldest supported release and the newest. From 2026.11 Home Assistant
        # publishes its own test package; the custom-component one stops at 2026.10.
        home-assistant: ["2026.8.3", "2026.11.0"]
        include:
          - home-assistant: "2026.8.3"
            fixture: "pytest-homeassistant-custom-component==0.13.357"
            types: true
          # Types are checked against the oldest release only: 2026.11 types its
          # forms with probatio, which 2026.8 does not have, where the code uses
          # voluptuous, which both releases still accept at run time.
          - home-assistant: "2026.11.0"
            fixture: "pytest-homeassistant==2026.11.0"
            types: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The whole environment is cached, not just the downloads, so a hit skips
      # dependency resolution as well. The key carries everything that decides
      # what gets installed, so it cannot serve a stale environment.
      - name: Restore the test environment
        id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VENV }}
          key: ci-venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-ha${{ matrix.home-assistant }}-fixture${{ matrix.fixture }}-${{ hashFiles('pyproject.toml', '.github/workflows/tests.yml') }}
      - name: Build the test environment
        if: steps.venv.outputs.cache-hit != 'true'
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install -e ".[test]"
          # The two test packages supply the same fixtures; only one may be installed.
          if [ "$FIXTURE" != "pytest-homeassistant-custom-component==0.13.357" ]; then
            "$VENV/bin/python" -m pip uninstall -y pytest-homeassistant-custom-component
            "$VENV/bin/python" -m pip install "$FIXTURE"
          fi
          frontend_requirement=$("$VENV/bin/python" -c 'import json, pathlib, homeassistant; path = pathlib.Path(homeassistant.__file__).parent / "components/frontend/manifest.json"; print(json.loads(path.read_text())["requirements"][0])')
          "$VENV/bin/python" -m pip install "$frontend_requirement"
          # Voice and camera tests import Home Assistant components whose
          # requirements are installed only when Home Assistant sets them up, so install the versions this
          # Home Assistant release declares.
          voice_requirements=$("$VENV/bin/python" -c 'import json, pathlib, homeassistant; root = pathlib.Path(homeassistant.__file__).parent / "components"; seen, todo, reqs = set(), ["assist_satellite", "assist_pipeline", "conversation", "camera", "stream"], []
          while todo:
              c = todo.pop()
              if c in seen or not (root / c / "manifest.json").exists(): continue
              seen.add(c); m = json.loads((root / c / "manifest.json").read_text()); reqs += m.get("requirements", []); todo += m.get("dependencies", []) + m.get("after_dependencies", [])
          print(" ".join(sorted(set(reqs))))')
          if [ -n "$voice_requirements" ]; then "$VENV/bin/python" -m pip install $voice_requirements; fi
      - name: Use the test environment
        run: echo "$VENV/bin" >> "$GITHUB_PATH"
      # Runs on a restored environment too: a cache hit is not permission to skip
      # checking that the environment is the one this matrix leg asked for.
      - name: Verify test environment
        env:
          FIXTURE: ${{ matrix.fixture }}
          EXPECTED_HA: ${{ matrix.home-assistant }}
        run: |
          python -m pip check
          python -c "import importlib.metadata as m, os; assert m.version('homeassistant') == os.environ['EXPECTED_HA']"
          python -c "import importlib.metadata as m, os; name, version = os.environ['FIXTURE'].split('=='); assert m.version(name) == version"
          python -c "import importlib.metadata as m; installed = [n for n in ('pytest-homeassistant', 'pytest-homeassistant-custom-component') if any(d.name == n for d in m.distributions())]; assert len(installed) == 1, installed"
          python -c "import sys; assert sys.prefix.endswith('ci-venv'), sys.prefix"
      - name: Run lint and formatting checks
        run: ruff check . && ruff format --check .
      # Restore-keys on purpose: an exact hit is rare because the key moves with
      # the sources, but even a stale cache saves mypy re-analysing Home Assistant.
      - name: Restore the type-check cache
        if: matrix.types
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-ha${{ matrix.home-assistant }}-${{ hashFiles('custom_components/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-ha${{ matrix.home-assistant }}-
      - name: Run type checks
        if: matrix.types
        run: mypy custom_components/panel_assistant
      - name: Run tests
        run: python -m pytest -n auto --timeout=300 --shard ${{ matrix.shard }}/2
      - name: Prove restart and replay safety in real Core processes
        if: matrix.shard == 1
        run: >-
          python tests/runtime/core_negative_harness.py
          --hass "$(command -v hass)"
          --expected-sha "$(git rev-parse HEAD)"
          --expected-home-assistant-version "${{ matrix.home-assistant }}"
