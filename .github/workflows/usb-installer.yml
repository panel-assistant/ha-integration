name: USB installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should stop burning a runner. Runs on main are never
# cancelled, because main's timings are what the CI budget measures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: custom_components/panel_assistant/frontend
        run: npm ci --ignore-scripts
      - name: Test and build frontend
        working-directory: custom_components/panel_assistant/frontend
        run: npm test && npm run build
      - name: Verify bundled HA module matches source
        run: git diff --exit-code -- custom_components/panel_assistant/static

  # A release tag publishes its own permanent copy at /<version>/. Pages replaces
  # the whole site on every deploy, so the site is rebuilt from every release tag
  # that has a copy, and the root serves the newest for releases up to 0.9.0.
  site:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Build every release's installer copy
        run: .github/scripts/build_installer_site.sh "$RUNNER_TEMP/site"
      - name: Require this release's copy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "$RUNNER_TEMP/site/$RELEASE_TAG/index.html"
      - name: Upload installer site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: usb-installer-pages
      cancel-in-progress: false
    steps:
      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # The release check: fails unless every copy, this release's included, is
      # live and byte-identical to what was just built.
      - name: Check out the release check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Fetch the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact
      - name: Verify the published installer copies
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$RUNNER_TEMP/site"
          python3 .github/scripts/verify_installer_copy.py "$RUNNER_TEMP/site" https://install.panel-assistant.io/
