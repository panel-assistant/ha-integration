name: USB installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should stop burning a runner. Runs on main are never
# cancelled, because main's timings are what the CI budget measures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && vars.CI_RUNNER == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: custom_components/panel_assistant/frontend
        run: npm ci --ignore-scripts
      - name: Verify packaged branding matches the published website
        run: node tools/brand/sync.mjs check
      - name: Test and build frontend
        working-directory: custom_components/panel_assistant/frontend
        run: npm test && npm run build
      - name: Verify bundled HA module matches source
        run: git diff --exit-code -- custom_components/panel_assistant/static

  # A release tag publishes its own permanent copy at /<version>/. A deploy
  # replaces the whole site, so it is rebuilt from every release tag that has a
  # copy, and the root serves the newest for releases up to 0.9.0. Snapshot,
  # build, deploy and verify run in one job under one lock, so tags are listed
  # only once the lock is held and an older release run can never deploy a site
  # that drops a newer release's copy. GitHub keeps one pending run per group and
  # drops the older pending one; that is safe because the surviving newer run
  # rebuilds every tag. A manual run on main republishes the same site, which is how
  # a tag whose own workflow predates this deploy gets its copy.
  site:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, as for the website.
    environment:
      name: cloudflare
    concurrency:
      group: usb-installer-site
      cancel-in-progress: false
    steps:
      - name: Check out repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Build every release's installer copy
        run: .github/scripts/build_installer_site.sh "$GITHUB_WORKSPACE/.installer-site"
      # Only a tag run has a release of its own; a dispatch on main republishes every tag's copy.
      - name: Require this release's copy
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "$GITHUB_WORKSPACE/.installer-site/$RELEASE_TAG/index.html"
      - name: Deploy installer site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .github/installer/wrangler.jsonc
      # The release check: fails unless every built file is live and unchanged,
      # and every release copy the repository's tags call for right now is live.
      - name: Verify the published installer copies
        run: |
          git fetch --tags --force origin
          tags=$(.github/scripts/build_installer_site.sh --list-tags)
          # shellcheck disable=SC2086 # one tag per word
          python3 .github/scripts/verify_installer_copy.py "$GITHUB_WORKSPACE/.installer-site" https://install.panel-assistant.io/ $tags
