name: USB installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should stop burning a runner. Runs on main are never
# cancelled, because main's timings are what the CI budget measures.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: custom_components/panel_assistant/frontend
        run: npm ci --ignore-scripts
      - name: Verify packaged branding matches the published website
        run: node tools/brand/sync.mjs check
      - name: Test and build frontend
        working-directory: custom_components/panel_assistant/frontend
        run: npm test && npm run build
      - name: Verify bundled HA module matches source
        run: git diff --exit-code -- custom_components/panel_assistant/static

  # A release tag publishes its own permanent copy at /<version>/. Pages replaces
  # the whole site on every deploy, so the site is rebuilt from every release tag
  # that has a copy, and the root serves the newest for releases up to 0.9.0.
  # Snapshot, build, upload, deploy and verify run in one job under one shared
  # lock, so tags are listed only once the lock is held and an older release run
  # can never deploy a site that drops a newer release's copy. GitHub keeps one
  # pending run per group and drops the older pending one; that is safe because
  # the surviving newer run rebuilds every tag.
  site:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: usb-installer-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: custom_components/panel_assistant/frontend/package-lock.json
      - name: Build every release's installer copy
        run: .github/scripts/build_installer_site.sh "$RUNNER_TEMP/site"
      - name: Require this release's copy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "$RUNNER_TEMP/site/$RELEASE_TAG/index.html"
      - name: Upload installer site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The release check: fails unless every built file is live and unchanged,
      # and every release copy the repository's tags call for right now is live.
      - name: Verify the published installer copies
        run: |
          git fetch --tags --force origin
          tags=$(.github/scripts/build_installer_site.sh --list-tags)
          # shellcheck disable=SC2086 # one tag per word
          python3 .github/scripts/verify_installer_copy.py "$RUNNER_TEMP/site" https://install.panel-assistant.io/ $tags
